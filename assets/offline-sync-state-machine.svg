<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="900" viewBox="0 0 1420 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eff6ff"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
  </marker>
  <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>
<rect width="1420" height="900" fill="url(#bg)"/>
<text x="44" y="58" font-size="33" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Offline Draft and Sync State Machine</text>
<text x="44" y="88" font-size="15" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Offline support is useful only when the states are visible and recoverable.</text>
<rect x="90" y="190" width="190" height="105" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="114" y="232" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Draft</text><text x="114" y="260" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Saved on device</text><rect x="325" y="190" width="190" height="105" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="349" y="232" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Queued</text><text x="349" y="260" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Waiting for network</text><rect x="560" y="190" width="190" height="105" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="584" y="232" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Syncing</text><text x="584" y="260" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">API request in progress</text><rect x="820" y="150" width="190" height="105" rx="18" fill="#ecfdf5" stroke="#86efac" opacity="1" filter="url(#shadow)"/><text x="844" y="192" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Synced</text><text x="844" y="220" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Server accepted</text><rect x="820" y="335" width="190" height="105" rx="18" fill="#fffbeb" stroke="#fde68a" opacity="1" filter="url(#shadow)"/><text x="844" y="377" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Needs review</text><text x="844" y="405" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Version or policy conflict</text><rect x="1080" y="335" width="190" height="105" rx="18" fill="#fef2f2" stroke="#fecaca" opacity="1" filter="url(#shadow)"/><text x="1104" y="377" font-size="20" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Blocked</text><text x="1104" y="405" font-size="13" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Not allowed or invalid</text><line x1="280" y1="242" x2="315" y2="242" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><line x1="515" y1="242" x2="550" y2="242" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 242 C780 220, 790 200, 815 200" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 255 C780 300, 785 370, 815 390" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1010 390 L1070 390" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/><rect x="90" y="520" width="1240" height="240" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="120" y="560" font-size="22" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Queue item contract</text><rect x="120" y="600" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="220" y="625" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">idempotency key</text><rect x="355" y="600" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="455" y="625" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">tenant reference</text><rect x="590" y="600" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="690" y="625" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">actor reference</text><rect x="825" y="600" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="925" y="625" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">entity reference</text><rect x="1060" y="600" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="1160" y="625" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">entity version</text><rect x="120" y="660" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="220" y="685" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">operation type</text><rect x="355" y="660" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="455" y="685" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">sanitized payload</text><rect x="590" y="660" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="690" y="685" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">retry count</text><rect x="825" y="660" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="925" y="685" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">status</text><rect x="1060" y="660" width="200" height="38" rx="19" fill="#eff6ff" stroke="#bfdbfe"/><text x="1160" y="685" font-size="12" fill="#1e3a8a" font-weight="750" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">last error code</text><text x="120" y="725" font-size="14" fill="#475569" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">The device can store drafts. The server is still the authority for permission, validation, stock, and approval state.</text></svg>
