ystem, Segoe UI, Arial">asset lookup</text><circle cx="430" cy="370" r="6" fill="#2563eb"/><text x="450" y="375" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">inventory search</text><circle cx="430" cy="425" r="6" fill="#2563eb"/><text x="450" y="430" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">dashboard summary</text><rect x="700" y="160" width="260" height="500" rx="18" fill="#fffbeb" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="728" y="205" font-size="21" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Queue then sync</text><circle cx="740" cy="260" r="6" fill="#2563eb"/><text x="760" y="265" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">notes</text><circle cx="740" cy="315" r="6" fill="#2563eb"/><text x="760" y="320" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">labor</text><circle cx="740" cy="370" r="6" fill="#2563eb"/><text x="760" y="375" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">meter readings</text><circle cx="740" cy="425" r="6" fill="#2563eb"/><text x="760" y="430" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">inspection answers</text><circle cx="740" cy="480" r="6" fill="#2563eb"/><text x="760" y="485" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">photo uploads</t