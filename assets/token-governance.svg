  <g font-family="Arial" font-size="18" font-weight="700" fill="#10203f">
    <rect x="95" y="145" width="270" height="140" rx="16" fill="#f8fbff" stroke="#9bbcf2" stroke-width="2"/>
    <text x="145" y="198">API Token</text>
    <text x="130" y="230" font-size="15" fill="#40516f">Hash, scopes, expiry</text>
