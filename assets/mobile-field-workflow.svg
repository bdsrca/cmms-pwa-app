<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="860" viewBox="0 0 1420 860">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eff6ff"/>
    <stop offset="0.48" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f8fafc"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
  </marker>
  <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
  </marker>
</defs>
<rect width="1420" height="860" fill="url(#bg)"/>
<text x="44" y="58" font-size="33" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Mobile Field Workflow</text>
<text x="44" y="88" font-size="15" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">The technician path is built around action, not navigation.</text>
<rect x="70" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="100" cy="194" r="18" fill="#2563eb"/><text x="100" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">1</text><text x="94" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">1. Open assignment</text><text x="94" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Assigned work orders</text>
<text x="94" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">and critical alerts</text>
<text x="94" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">appear first.</text><line x1="260" y1="265" x2="296" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="290" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="320" cy="194" r="18" fill="#2563eb"/><text x="320" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">2</text><text x="314" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">2. Identify asset</text><text x="314" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Search, scan, or</text>
<text x="314" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">select an asset near</text>
<text x="314" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">the work location.</text><line x1="480" y1="265" x2="516" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="540" cy="194" r="18" fill="#2563eb"/><text x="540" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">3</text><text x="534" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">3. Capture work</text><text x="534" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Notes, labor, photos,</text>
<text x="534" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">meter readings, parts</text>
<text x="534" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">requests.</text><line x1="700" y1="265" x2="736" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="760" cy="194" r="18" fill="#2563eb"/><text x="760" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">4</text><text x="754" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">4. Save locally</text><text x="754" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">If the network drops,</text>
<text x="754" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">drafts stay visible</text>
<text x="754" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">and recoverable.</text><line x1="920" y1="265" x2="956" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="950" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="980" cy="194" r="18" fill="#2563eb"/><text x="980" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">5</text><text x="974" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">5. Sync to server</text><text x="974" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">The API rechecks</text>
<text x="974" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">permissions, versions,</text>
<text x="974" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">and idempotency.</text><line x1="1140" y1="265" x2="1176" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><rect x="1170" y="160" width="190" height="210" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="1200" cy="194" r="18" fill="#2563eb"/><text x="1200" y="200" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">6</text><text x="1194" y="252" font-size="17" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">6. Review result</text><text x="1194" y="282" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Synced, needs review,</text>
<text x="1194" y="300" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">or blocked with a</text>
<text x="1194" y="318" font-size="13" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">useful reason.</text><rect x="90" y="460" width="580" height="300" rx="18" fill="#f8fafc" stroke="#cbd5e1" opacity="1" filter="url(#shadow)"/><text x="120" y="505" font-size="22" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Mobile rules that matter in maintenance</text><circle cx="132" cy="545" r="6" fill="#14b8a6"/><text x="152" y="550" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">One-column field screens</text><circle cx="132" cy="580" r="6" fill="#14b8a6"/><text x="152" y="585" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Large tap targets for gloves and quick use</text><circle cx="132" cy="615" r="6" fill="#14b8a6"/><text x="152" y="620" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Sticky save bar for long forms</text><circle cx="132" cy="650" r="6" fill="#14b8a6"/><text x="152" y="655" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Camera and file capture close to the work note</text><circle cx="132" cy="685" r="6" fill="#14b8a6"/><text x="152" y="690" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Offline state shown next to the action that created it</text><circle cx="132" cy="720" r="6" fill="#14b8a6"/><text x="152" y="725" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">No hidden desktop-only controls</text><rect x="745" y="460" width="580" height="300" rx="18" fill="#fff7ed" stroke="#fed7aa" opacity="1" filter="url(#shadow)"/><text x="775" y="505" font-size="22" fill="#0f172a" font-weight="800" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">What stays online-only</text><circle cx="787" cy="545" r="6" fill="#f97316"/><text x="807" y="550" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Payment and plan changes</text><circle cx="787" cy="587" r="6" fill="#f97316"/><text x="807" y="592" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">API token creation and rotation</text><circle cx="787" cy="629" r="6" fill="#f97316"/><text x="807" y="634" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">AI provider calls</text><circle cx="787" cy="671" r="6" fill="#f97316"/><text x="807" y="676" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Final approvals that require current state</text><circle cx="787" cy="713" r="6" fill="#f97316"/><text x="807" y="718" font-size="15" fill="#334155" font-weight="600" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Inventory adjustments that require real-time stock validation</text></svg>
