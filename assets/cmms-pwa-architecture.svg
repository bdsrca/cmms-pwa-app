<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-label="CMMS mobile PWA architecture">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fbff; stroke: #b8cdf4; stroke-width: 2; }
      .panel2 { fill: #f7fffd; stroke: #9bd8d2; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #c6d6ee; stroke-width: 1.7; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f1f46; }
      .text { font: 700 18px Arial, sans-serif; fill: #10203f; }
      .small { font: 600 15px Arial, sans-serif; fill: #40516f; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .guard { font: 700 22px Arial, sans-serif; fill: #0f3b5f; }
      .dot { fill: #2563eb; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="1500" height="760"/>
  <rect class="panel" x="50" y="60" width="350" height="500" rx="20"/>
  <text class="title" x="125" y="110">Client Layer</text>
  <g transform="translate(90 155)">
    <rect class="box" x="0" y="0" width="270" height="65" rx="12"/>
    <text class="text" x="74" y="40">Mobile UI</text>
    <rect class="box" x="0" y="85" width="270" height="65" rx="12"/>
    <text class="text" x="62" y="125">PWA Shell</text>
    <rect class="box" x="0" y="170" width="270" height="65" rx="12"/>
    <text class="text" x="58" y="210">Local Drafts</text>
    <rect class="box" x="0" y="255" width="270" height="65" rx="12"/>
    <text class="text" x="58" y="295">Sync Queue</text>
  </g>
  <rect class="panel" x="575" y="60" width="350" height="500" rx="20"/>
  <text class="title" x="645" y="110">Server Layer</text>
  <g transform="translate(615 155)">
    <rect class="box" x="0" y="0" width="270" height="65" rx="12"/>
    <text class="text" x="78" y="40">API Gateway</text>
    <rect class="box" x="0" y="85" width="270" height="65" rx="12"/>
    <text class="text" x="70" y="125">Auth Policy</text>
    <rect class="box" x="0" y="170" width="270" height="65" rx="12"/>
    <text class="text" x="68" y="210">CMMS Services</text>
    <rect class="box" x="0" y="255" width="270" height="65" rx="12"/>
    <text class="text" x="64" y="295">Audit Logs</text>
  </g>
  <rect class="panel2" x="1090" y="60" width="360" height="500" rx="20"/>
  <text class="title" x="1162" y="110">Controlled Services</text>
  <g transform="translate(1130 155)">
    <rect class="box" x="0" y="0" width="280" height="65" rx="12"/>
    <text class="text" x="72" y="40">Payment Provider</text>
    <rect class="box" x="0" y="85" width="280" height="65" rx="12"/>
    <text class="text" x="95" y="125">AI Gateway</text>
    <rect class="box" x="0" y="170" width="280" height="65" rx="12"/>
    <text class="text" x="88" y="210">API Tokens</text>
    <rect class="box" x="0" y="255" width="280" height="65" rx="12"/>
    <text class="text" x="78" y="295">Operational DB</text>
  </g>
  <line class="arrow" x1="400" y1="310" x2="560" y2="310"/>
  <line class="arrow" x1="925" y1="310" x2="1075" y2="310"/>
  <rect class="panel" x="160" y="615" width="1180" height="78" rx="18"/>
  <text class="guard" x="300" y="665">Tenant Scope</text>
  <circle class="dot" cx="500" cy="657" r="6"/>
  <text class="guard" x="540" y="665">Role Access</text>
  <circle class="dot" cx="720" cy="657" r="6"/>
  <text class="guard" x="760" y="665">Offline Draft Review</text>
  <circle class="dot" cx="1045" cy="657" r="6"/>
  <text class="guard" x="1085" y="665">No Raw Secrets in Browser</text>
</svg>
