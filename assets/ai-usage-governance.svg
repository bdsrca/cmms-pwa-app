<text x="966" y="292" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">only</text><line x1="1132" y1="260" x2="1167" y2="260" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/><rect x="1160" y="160" width="190" height="195" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><circle cx="1190" cy="194" r="18" fill="#7c3aed"/><text x="1190" y="200" font-size="13" fill="#ffffff" font-weight="850" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">6</text><text x="1184" y="245" font-size="17" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">Usage log</text><text x="1184" y="275" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">cost estimate, status,</text>
<text x="1184" y="292" font-size="12" fill="#475569" font-weight="400" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">no private prompt dump</text><rect x="90" y="460" width="1235" height="250" rx="18" fill="#ffffff" stroke="#bfdbfe" opacity="1" filter="url(#shadow)"/><text x="120" y="505" font-size="22" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">What the browser should never receive</text><rect x="120" y="527" width="340" height="44" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="142" y="555" font-size="13" fill="#991b1b" font-weight="750" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">model provider secret</text><rect x="510" y="527" width="340" height="44" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="532" y="555" font-size="13" fill="#991b1b" font-weight="750" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">raw tenant prompt logs</text><rect x="900" y="527" width="340" height="44" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="922" y="555" font-size="13" fill="#991b1b" font-weight="750" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">payment provider secrets</text><rect x="120" y="592" width="340" height="44" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="142" y="620" font-size="13" fill="#991b1b" font-weight="750" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">full private work-order payloads when a summary is enough</text><rect x="510" y="592" width="340" height="44" rx="22" fill="#fef2f2" stroke="#fecaca"/><text x="532" y="620" font-size="13" fill="#991b1b" font-weight="750" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">cross-tenant context</text><text x="120" y="690" font-size="14" fill="#475569" font-weight="650" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">The AI layer is a controlled gateway, not a direct browser-to-model integration.</text></svg>
