<rect width="1420" height="900" fill="url(#bg)"/>
<text x="44" y="58" font-size="33" fill="#0f172a" font-weight="850" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">AI Usage Governance for a Future CMMS/EAM PWA</text>
<text x="44" y="88" font-size="15" fill="#475569" font-weight="500" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial">AI features can help field work only when model calls are routed, budgeted, and logged safely.</text>
